# SICK LMS111 — 270 deg, 25 Hz, 20 m, 0.5 deg resolution
world:
  height: 24
  width: 24
  step_time: 0.04    # 25 Hz scan rate
  sample_time: 0.04
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.25}
    state: [1, 1, 0]
    goal: [22, 22, 0]
    behavior: {name: 'dash'}
    sensors:
      - name: 'lidar2d'
        range_min: 0.5       # 50 cm dead zone
        range_max: 20.0      # 20 m max range
        angle_range: 4.712   # 270 deg sweep
        number: 541          # 0.5 deg angular resolution
        noise: True
        std: 0.015           # 15 mm range noise (1-sigma)
        angle_std: 0.009     # ~0.5 deg angular noise
        offset: [0, 0, 0]
        plot:
          alpha: 0.3

obstacle:
  # Perimeter boundary wall
  - shape: {name: 'linestring', vertices: [[0.2, 0.2], [23.8, 0.2], [23.8, 23.8], [0.2, 23.8], [0.2, 0.2]]}
    state: [0, 0, 0]
  # Interior walls
  - shape: {name: 'linestring', vertices: [[0.2, 12], [10, 12]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[14, 12], [23.8, 12]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[12, 0.2], [12, 8]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[12, 14], [12, 23.8]]}
    state: [0, 0, 0]
  # Boxes
  - shape: {name: 'rectangle', length: 2.5, width: 1.2}
    state: [4, 17, 0.3]
  - shape: {name: 'rectangle', length: 1.8, width: 2.5}
    state: [18, 6, 0.7]
  - shape: {name: 'rectangle', length: 3.5, width: 0.8}
    state: [18, 19, 0]
  # Circles
  - shape: {name: 'circle', radius: 0.7}
    state: [4, 4, 0]
  - shape: {name: 'circle', radius: 0.5}
    state: [14, 5, 0]
  - shape: {name: 'circle', radius: 0.9}
    state: [20, 13, 0]
  - shape: {name: 'circle', radius: 0.6}
    state: [3, 20, 0]
