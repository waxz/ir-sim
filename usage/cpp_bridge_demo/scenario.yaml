world:
  height: 10
  width: 10
  step_time: 0.05   # 20 Hz sim steps (fast enough for control)
  sample_time: 0.05

robot:
  kinematics: {name: 'diff'}
  shape: {name: 'circle', radius: 0.2}
  state: [1.0, 1.0, 0.0]
  vel_max: [1.0, 1.5]
  goal:
    - [[8.5, 8.5, 0]]

obstacle:
  - shape: {name: 'circle', radius: 0.5}
    state: [3.5, 3.5, 0]
    static: true
  - shape: {name: 'circle', radius: 0.5}
    state: [6.0, 5.0, 0]
    static: true
  - shape: {name: 'rectangle', length: 1.5, width: 0.4}
    state: [5.0, 2.5, 0.4]
    static: true
