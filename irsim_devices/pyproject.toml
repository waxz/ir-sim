[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "irsim-devices"
version = "0.1.0"
description = "Standalone sensor and actuator simulation models — IMU, LiDAR 2D/3D, encoder, DC motor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
lidar2d = ["shapely>=2.1.2", "matplotlib"]
lidar3d = ["open3d"]
all = ["shapely>=2.1.2", "matplotlib", "open3d"]
dev = ["pytest", "numpy", "shapely>=2.1.2"]

[project.urls]
Repository = "https://github.com/hanruihua/ir-sim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"irsim_devices" = ["*.so", "*.pyd"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
