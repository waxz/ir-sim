[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "shmbridge"
version = "2.1.0"
description = "POSIX shared-memory seqlock bridge for Python and C++ robot control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev   = ["pytest", "numpy", "pybind11>=2.12"]

[tool.scikit-build]
# Source layout: Python package in src/shmbridge, C++ extension in csrc/
wheel.packages = ["src/shmbridge"]
cmake.build-type = "Release"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "C4", "SIM", "ISC", "RET", "PT"]
ignore = ["E501"]
