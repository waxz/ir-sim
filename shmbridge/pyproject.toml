[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shmbridge"
version = "2.0.0"
description = "Zero-dependency POSIX shared-memory seqlock bridge for Python ↔ C++ robot control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev   = ["pytest", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/shmbridge"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "C4", "SIM", "ISC", "RET", "PT"]
ignore = ["E501"]
