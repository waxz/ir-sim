name: shmbridge Demo Verification

# Runs the C++ and Python demos end-to-end to verify IPC communication.
#
#   python-demo   — python_node_demo.py (self-contained: publisher restarts
#                   twice, subscriber detects staleness and re-attaches)
#                   Runs on Ubuntu and Windows to cover both backends.
#
#   cpp-demo      — builds talker + listener, runs them for 5 s and checks
#                   neither crashes; Ubuntu only (POSIX shared memory).
#
# Triggers:
#   • push / PR that touches any example, include/, or src/ file, or this file
#   • manual dispatch (workflow_dispatch)

on:
  push:
    paths:
      - 'shmbridge/examples/**'
      - 'shmbridge/include/**'
      - 'shmbridge/src/**'
      - '.github/workflows/shmbridge-demos-verify.yml'
      - '.github/workflows/shmbridge-cpp-demos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shmbridge/examples/**'
      - 'shmbridge/include/**'
      - 'shmbridge/src/**'
      - '.github/workflows/shmbridge-demos-verify.yml'
      - '.github/workflows/shmbridge-cpp-demos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python in-process demo ────────────────────────────────────────────────
  # python_node_demo.py runs a publisher (2 runs with a 1 s restart gap) and
  # a subscriber in the same process.  The subscriber survives the restart and
  # re-attaches automatically.  The script exits 0 when both threads finish.
  python-demo:
    name: Python demo · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install "scikit-build-core>=0.8" "pybind11>=2.12"

      - name: Install shmbridge (with C++ extension)
        run: pip install --no-build-isolation ./shmbridge

      - name: Verify C++ backend loaded
        run: |
          python -c "
          import shmbridge
          print('shmbridge', shmbridge.__version__, 'backend=' + shmbridge._BACKEND)
          assert shmbridge._BACKEND == 'cpp', f'expected cpp backend, got {shmbridge._BACKEND!r}'
          "

      - name: Run python_node_demo (publisher restart + subscriber reconnect)
        timeout-minutes: 2
        run: python shmbridge/examples/python_node_demo.py

      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo "## Python demo — ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran \`python_node_demo.py\`: publisher restarts twice, subscriber" >> "$GITHUB_STEP_SUMMARY"
          echo "detects staleness and re-attaches automatically." >> "$GITHUB_STEP_SUMMARY"

  # ── C++ talker + listener smoke test ─────────────────────────────────────
  # Builds both demos and runs them together for 5 s.  Verifies that neither
  # process crashes during that window (both remain alive after 2 s).
  # Ubuntu only — relies on POSIX shm_open / mmap.
  cpp-demo:
    name: C++ demo smoke · ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build talker + listener
        run: |
          cmake -B shmbridge/examples/cpp_node/build \
                -S shmbridge/examples/cpp_node \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build shmbridge/examples/cpp_node/build --parallel $(nproc)

      - name: Build controller
        run: |
          cmake -B shmbridge/examples/cpp_controller/build \
                -S shmbridge/examples/cpp_controller \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build shmbridge/examples/cpp_controller/build --parallel $(nproc)

      - name: Build pipeline (sensor_node + planner_node + control_node)
        run: |
          cmake -B shmbridge/examples/cpp_pipeline/build \
                -S shmbridge/examples/cpp_pipeline \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build shmbridge/examples/cpp_pipeline/build --parallel $(nproc)

      - name: Smoke test — talker + listener (5 s)
        run: |
          set -e
          TALKER=shmbridge/examples/cpp_node/build/talker
          LISTENER=shmbridge/examples/cpp_node/build/listener

          "$TALKER"   > /tmp/talker.log   2>&1 &  TALKER_PID=$!
          "$LISTENER" > /tmp/listener.log 2>&1 &  LISTENER_PID=$!

          # Let them negotiate and exchange a few frames
          sleep 2

          if ! kill -0 $TALKER_PID 2>/dev/null; then
            echo "ERROR: talker exited early"; cat /tmp/talker.log; exit 1
          fi
          if ! kill -0 $LISTENER_PID 2>/dev/null; then
            echo "ERROR: listener exited early"; cat /tmp/listener.log; exit 1
          fi
          echo "Both processes alive after 2 s — letting them run 3 s more"

          sleep 3
          kill $TALKER_PID $LISTENER_PID 2>/dev/null || true
          wait $TALKER_PID  2>/dev/null || true
          wait $LISTENER_PID 2>/dev/null || true

          echo "--- talker output ---"
          cat /tmp/talker.log
          echo "--- listener output ---"
          cat /tmp/listener.log
          echo "Smoke test passed"

      - name: Smoke test -- pipeline (sensor + planner + control, 8 s)
        run: |
          set -e
          SENSOR=shmbridge/examples/cpp_pipeline/build/sensor_node
          PLANNER=shmbridge/examples/cpp_pipeline/build/planner_node
          CONTROL=shmbridge/examples/cpp_pipeline/build/control_node

          "$SENSOR"  > /tmp/sensor.log  2>&1 &  SENSOR_PID=$!
          "$PLANNER" > /tmp/planner.log 2>&1 &  PLANNER_PID=$!
          "$CONTROL" > /tmp/control.log 2>&1 &  CONTROL_PID=$!

          # Give nodes time to connect and exchange a few cycles
          sleep 3

          for name in sensor planner control; do
            eval PID=\$${name^^}_PID
            if ! kill -0 $PID 2>/dev/null; then
              echo "ERROR: ${name}_node exited early"
              cat /tmp/${name}.log
              exit 1
            fi
          done
          echo "All three pipeline nodes alive after 3 s -- running 5 s more"

          sleep 5
          kill $SENSOR_PID $PLANNER_PID $CONTROL_PID 2>/dev/null || true
          wait $SENSOR_PID  2>/dev/null || true
          wait $PLANNER_PID 2>/dev/null || true
          wait $CONTROL_PID 2>/dev/null || true

          echo "--- sensor_node output ---"
          cat /tmp/sensor.log
          echo "--- planner_node output ---"
          cat /tmp/planner.log
          echo "--- control_node output ---"
          cat /tmp/control.log
          echo "Pipeline smoke test passed"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo "## C++ demo smoke -- ubuntu-latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Binary pair | Duration | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| talker + listener | 5 s | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sensor + planner + control | 8 s | completed |" >> "$GITHUB_STEP_SUMMARY"
