name: IMU C Extension

on:
  push:
    branches: [main]
    paths:
      - "irsim/lib/algorithm/imu_c_ext.c"
      - "irsim/lib/algorithm/_imu_c_ext_module.c"
      - "irsim/lib/algorithm/imu_c_integrators.py"
      - "irsim/lib/algorithm/imu_pose_estimator.py"
      - "tests/test_imu_c_ext.py"
      - "setup.py"
      - ".github/workflows/imu-c-ext.yml"
  pull_request:
    paths:
      - "irsim/lib/algorithm/imu_c_ext.c"
      - "irsim/lib/algorithm/_imu_c_ext_module.c"
      - "irsim/lib/algorithm/imu_c_integrators.py"
      - "irsim/lib/algorithm/imu_pose_estimator.py"
      - "tests/test_imu_c_ext.py"
      - "setup.py"
      - ".github/workflows/imu-c-ext.yml"

jobs:
  test-c-ext:
    name: C extension (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install package dependencies
        run: uv sync --locked --dev

      - name: Build C extensions in-place
        run: uv run --with setuptools python setup.py build_ext --inplace

      - name: Run C extension tests
        run: uv run pytest tests/test_imu_c_ext.py -v --tb=short
