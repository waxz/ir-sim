name: Ray-Casting Extension Guard

# Verifies that the C extension platform guards work correctly:
# - Linux x86-64: OMP + AVX2 both available
# - macOS x86-64:  OMP + AVX2 both available (march=native enables AVX2)
# - macOS arm64:   OMP available, AVX2 unavailable (no AVX2 on Apple Silicon)
# - Windows x64:   OMP + AVX2 both available (IsProcessorFeaturePresent detects AVX2)
# - Fallback test: with NO compiler, both unavailable → NumPy kernel used

on:
  push:
    branches: ["claude/readme-paper-analysis-p1wpth"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "Linux x86-64 (OMP+AVX2 expected)"
            expect_omp: "true"
            expect_avx2: "true"
          - os: macos-13
            label: "macOS x86-64 Intel (OMP+AVX2 expected)"
            expect_omp: "true"
            expect_avx2: "true"
          - os: macos-latest
            label: "macOS arm64 Apple Silicon (OMP only)"
            expect_omp: "true"
            expect_avx2: "false"
          - os: windows-latest
            label: "Windows x64 (OMP+AVX2 via IsProcessorFeaturePresent)"
            expect_omp: "true"
            expect_avx2: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install project with dev deps
        run: uv sync --dev

      - name: Build C extension
        run: |
          uv pip install setuptools
          uv run python setup.py build_ext --inplace

      - name: Verify OMP and AVX2 availability
        run: uv run python .github/scripts/verify_ext.py ${{ matrix.expect_omp }} ${{ matrix.expect_avx2 }}

      - name: Smoke-test cast_ray_segments_avx2 fallback
        run: uv run python .github/scripts/smoke_test_avx2.py

      - name: Benchmark ray-casting kernels
        run: uv run python .github/scripts/bench_ray_casting.py

  fallback-no-compiler:
    name: "Fallback (no compiler → NumPy only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install project (no build of C extension)
        run: uv sync --dev

      - name: Verify graceful NumPy fallback (no .so present)
        run: uv run python .github/scripts/verify_fallback.py
