name: shmbridge C++ Demos

# Builds all standalone C++ demos (talker/listener, controller, pipeline)
# on Ubuntu, macOS, and Windows, and uploads them as downloadable binaries.
#
# Triggered by:
#   • push / PR touching any example source, header, or this file
#   • manual dispatch (Actions → Run workflow)

on:
  push:
    paths:
      - 'shmbridge/examples/cpp_node/**'
      - 'shmbridge/examples/cpp_controller/**'
      - 'shmbridge/examples/cpp_pipeline/**'
      - 'shmbridge/include/**'
      - 'shmbridge/src/**'
      - '.github/workflows/shmbridge-cpp-demos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shmbridge/examples/cpp_node/**'
      - 'shmbridge/examples/cpp_controller/**'
      - 'shmbridge/examples/cpp_pipeline/**'
      - 'shmbridge/include/**'
      - 'shmbridge/src/**'
      - '.github/workflows/shmbridge-cpp-demos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      # All three example trees build into a single flat dist/ directory.
      # CMAKE_RUNTIME_OUTPUT_DIRECTORY        — GCC / Clang (single-config)
      # CMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE — MSVC (multi-config)

      # ── talker + listener ────────────────────────────────────────────────
      - name: Configure cpp_node
        run: >
          cmake -B shmbridge/examples/cpp_node/build
          -S shmbridge/examples/cpp_node
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/dist
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=${{ github.workspace }}/dist

      - name: Build cpp_node
        run: cmake --build shmbridge/examples/cpp_node/build --config Release --parallel

      # ── controller ───────────────────────────────────────────────────────
      - name: Configure cpp_controller
        run: >
          cmake -B shmbridge/examples/cpp_controller/build
          -S shmbridge/examples/cpp_controller
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/dist
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=${{ github.workspace }}/dist

      - name: Build cpp_controller
        run: cmake --build shmbridge/examples/cpp_controller/build --config Release --parallel

      # ── pipeline (sensor_node + planner_node + control_node) ─────────────
      - name: Configure cpp_pipeline
        run: >
          cmake -B shmbridge/examples/cpp_pipeline/build
          -S shmbridge/examples/cpp_pipeline
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/dist
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=${{ github.workspace }}/dist

      - name: Build cpp_pipeline
        run: cmake --build shmbridge/examples/cpp_pipeline/build --config Release --parallel

      # ── list what was built ───────────────────────────────────────────────
      - name: Show binaries
        shell: bash
        run: ls -lh dist/

      # ── step summary ──────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        shell: bash
        run: |
          echo "## shmbridge C++ demo binaries — ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Binary | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*; do
            size=$(du -sh "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done

      # ── upload downloadable artifact ──────────────────────────────────────
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: shmbridge-cpp-demos-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
