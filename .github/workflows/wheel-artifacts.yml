name: Wheel Artifacts

# Builds distribution wheels for both ir-sim and shmbridge and uploads them
# as downloadable GitHub Actions artifacts.  No PyPI publish here — that is
# handled by build-wheels.yml (ir-sim) on tag pushes.
#
# Triggers:
#   • push / PR that touches either package source or this workflow file
#   • manual dispatch (workflow_dispatch)
on:
  push:
    paths:
      - 'irsim/**'
      - 'shmbridge/**'
      - 'pyproject.toml'
      - '.github/workflows/wheel-artifacts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'irsim/**'
      - 'shmbridge/**'
      - 'pyproject.toml'
      - '.github/workflows/wheel-artifacts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 — ir-sim wheels
#
# ir-sim has an optional C+OpenMP extension; cibuildwheel builds platform-
# specific wheels on both Ubuntu (manylinux) and Windows (MSVC).
# Configuration is read from [tool.cibuildwheel] in the root pyproject.toml.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  irsim-wheels:
    name: ir-sim · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.23.0
        # Reads [tool.cibuildwheel] from the root pyproject.toml.

      - name: Show produced wheels
        shell: bash
        run: ls -lh wheelhouse/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: irsim-wheels-${{ matrix.os }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 30

# ──────────────────────────────────────────────────────────────────────────────
# Job 2 — shmbridge wheels
#
# shmbridge has a mandatory pybind11 C++ extension (platform.hpp wraps SHM/
# time/futex for Linux, Windows 10+).  Builds manylinux wheels on Ubuntu and
# MSVC wheels on Windows.
# Configuration is read from [tool.cibuildwheel] in shmbridge/pyproject.toml.
# ──────────────────────────────────────────────────────────────────────────────
  shmbridge-wheels:
    name: shmbridge · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.23.0
        with:
          # Point cibuildwheel at the shmbridge sub-package.
          package-dir: shmbridge

      - name: Show produced wheels
        shell: bash
        run: ls -lh wheelhouse/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shmbridge-wheels-${{ matrix.os }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 30
